<script>
'use strict';
const $=id=>document.getElementById(id), L=(en,cs)=>s.lang==='cs'?cs:en;
/* === v0.4: Pure packet-logic functions — no DOM, no localStorage === */
function fieldChecksum(str){let sum=0;for(let i=0;i<str.length;i++)sum+=str.charCodeAt(i);return sum%256}
function packetChecksum(a,b,c){return(fieldChecksum(a)+fieldChecksum(b)+fieldChecksum(c))%256}
function identifyTamperedFields(rcv,arch){return['A','B','C'].filter(k=>fieldChecksum(rcv[k])!==fieldChecksum(arch[k]))}
function verifySlots(slot1,slot2){const t=['B','C'];if(!t.includes(slot1)||!t.includes(slot2))return{valid:false,reason:'field'};if(slot1==='B'&&slot2==='C')return{valid:true,reason:'correct'};return{valid:false,reason:'order'}}
function verifyChannel(channel){return channel==='EO-7'}
/* === end v0.4 pure functions === */
const glyphs=['window','stair','key','wake','arch','beacon','gate','cross','hook','twin'];
const pattern=['111/101/111','001/011/111','110/011/001','101/010/101','111/101/101','010/111/101','101/111/101','010/111/010','011/010/110','101/101/101'];
const gnames=[['window','okno'],['stair','schod'],['key','klíč'],['wake','vlna'],['arch','oblouk'],['beacon','maják'],['gate','brána'],['cross','kříž'],['hook','hák'],['twin bars','dva sloupky']];
function glyph(i){const bits=pattern[i].split('/');return '<svg class="glyph" role="img" aria-label="'+L(...gnames[i])+'" viewBox="0 0 3 3" shape-rendering="crispEdges">'+bits.map((r,y)=>[...r].map((b,x)=>b==='1'?'<rect fill="currentColor" x="'+x+'" y="'+y+'" width="1" height="1"/>':'').join('')).join('')+'</svg>'}
const pages={
'214':{title:['Harbour watch','Přístavní hlídka'],rub:['WATER & WEATHER','VODA A POČASÍ'],time:'23:38',glyph:7,clue:1,desc:['The harbour keeper filed three observations before the gauge went under.','Přístavní hlídač odeslal tři hlášení, než vodočet zmizel pod hladinou.'],rows:[[['Wind from the east.','Vítr od východu.']],[['East Steps: no lights visible.','Východní schody: žádná světla.'],['Five residents waiting on the East Steps.','Na Východních schodech čeká pět lidí.']],[['Gauge: two feet over the red mark.','Hladina: dvě stopy nad červenou ryskou.']]]},
'326':{title:['Ferry movements','Pohyby přívozu'],rub:['TRAVEL DESK','DOPRAVNÍ REDAKCE'],time:'23:46',glyph:3,clue:2,desc:['The last movement of the night boat, copied from the wheelhouse slip.','Poslední pohyb nočního přívozu podle záznamu z kormidelny.'],rows:[[['Vessel: The Little Wren.','Plavidlo: Střízlík.']],[['Port lamp out. Starboard clear.','Levé světlo nesvítí. Pravé v pořádku.']],[['Outbound. Return run cancelled.','Odplouvá. Zpáteční plavba zrušena.'],['Turning back. Rope ready on deck.','Obracíme se. Lano na palubě připraveno.']]]},
'418':{title:['Switchboard','Telefonní ústředna'],rub:['NIGHT CALLS','NOČNÍ HOVORY'],time:'23:42',glyph:9,clue:0,desc:['One wire stayed open after the town exchange lost its lights.','Když v městské ústředně zhaslo, jediná linka zůstala v provozu.'],rows:[[['East Steps line: no connection.','Linka Východní schody: bez spojení.'],['Caller to ferry: “We are still here.”','Volající přívozu: „Jsme pořád tady.“']],[['Operator: Nell Bell.','Telefonistka: Nell Bellová.']],[['Receiver left off the hook.','Sluchátko zůstalo vyvěšené.']]]}
};
const all=['100','214','326','418','500','793'], storageKey='merewick.teletext.v2';
function blank(lang='en'){return {lang,page:'100',found:[],won:false,draft:false,started:false,map:emptyMap(),slots:[],channel:null,tapeTime:0,tapeTranscript:false}}
function read(){try{const x=JSON.parse(localStorage.getItem(storageKey)||'null');if(!x||typeof x!=='object'){const legacy=JSON.parse(localStorage.getItem('merewick.teletext.v1')||'null');return blank(legacy?.lang==='cs'?'cs':'en')}const a=blank(x.lang==='cs'?'cs':'en');a.found=Object.keys(pages).filter(k=>Array.isArray(x.found)&&x.found.includes(k));a.won=x.won===true&&a.found.length===3;a.draft=x.draft===true&&a.found.length===3&&!a.won;a.map=alignState(x.map);a.tapeTime=boundedTapeTime(x.tapeTime);a.tapeTranscript=x.tapeTranscript===true;a.started=x.started===true||a.found.length>0;a.page=(all.includes(x.page)||casePages.includes(x.page))&&(x.page!=='793'||a.found.length===3)?x.page:'100';if(a.draft){const rawSlots=Array.isArray(x.slots)?x.slots:[];a.slots=[...new Set(rawSlots.filter(v=>['A','B','C'].includes(v)))].slice(0,2);const slotsComplete=a.slots.length===2&&verifySlots(a.slots[0],a.slots[1]).valid;a.channel=slotsComplete&&x.channel==='EO-7'?'EO-7':null}else{a.slots=[];a.channel=null}return a}catch{return blank()}}
let s, mode='live', buf='', dialogKind='', notice='',hintLevel=0, entryFocus=null;const persist=()=>{try{localStorage.setItem(storageKey,JSON.stringify(s))}catch{}};
function btn(act,val,body,cls='',extra=''){return '<button type="button" class="'+cls+'" data-do="'+act+'" data-val="'+val+'" '+extra+'>'+body+'</button>'}
function title(p){if(caseInfo[p])return L(...caseInfo[p].title);return p==='100'?L('Service index','Obsah vysílání'):p==='500'?L('Service manual','Servisní příručka'):p==='793'?L('Last transmission','Poslední přenos'):p==='326'?L('Last ferry tape','Poslední páska'):p==='418'?L('Find the landing','Najdi přístaviště'):L(...pages[p].title)}
function tell(t=''){notice=t;$('notice').textContent=t;$('notice').hidden=!t}
function updateDigits(){$('digits').textContent=buf?buf.padEnd(3,'·'):s.page}
function route(p){return btn('go',p,'<b>'+p+'</b> '+title(p)+'<span class="arrow">'+(s.found.includes(p)?'✓':'›')+'</span>','route')}
function getEvidence(chronological=false){if(!s.found.length)return '<p class="lead">'+L('The log is empty. Start with the mismatched harbour bulletin on P214.','Deník je prázdný. Začni u přepsané zprávy z přístavu na P214.')+'</p>';return s.found.slice().sort((a,b)=>chronological?pages[a].time.localeCompare(pages[b].time):a.localeCompare(b)).map(k=>{let p=pages[k];return '<div class="evidence">'+glyph(p.glyph)+'<time>'+p.time+'</time> <span>'+(k==='326'?L('Right lamp flashed twice. The skipper acknowledged the distress signal.','Pravá lampa dvakrát blikla. Převoznice potvrdila tísňový signál.'):k==='418'?L('Reconstructed route: C4 → D3 → E3. The boat reached East Steps.','Obnovená trasa: C4 → D3 → E3. Přívoz doplul k Východním schodům.'):L(...p.rows[p.clue][1]))+'</span></div>'}).join('')}
function tower(){const w=94,h=53,pts=new Map,px=(x,y,c)=>{x=Math.round(x);y=Math.round(y);if(x>=0&&y>=0&&x<w&&y<h)pts.set(x+','+y,c)};
const line=(x,y,X,Y,c)=>{let n=Math.max(Math.abs(X-x),Math.abs(Y-y))*2;for(let j=0;j<=n;j++)px(x+(X-x)*j/n,y+(Y-y)*j/n,c)};
const pale='#b0df9e', dim='#618863',gold='#e2b769';
for(let x=3;x<91;x++){let y=48-4*Math.exp(-Math.pow((x-49)/19,2))+2*Math.sin(x*.15);px(x,y,dim);if(x%4<2)px(x,y+2,pale);if(x%3===0)px(x,y+4,dim)}
line(47,14,47,21,pale);line(46,20,36,44,pale);line(48,20,58,44,pale);line(36,44,46,39,pale);line(48,39,58,44,pale);for(let i=0;i<4;i++){let y=22+i*5,r=(y-18)*.41;line(47-r,y,47+r,y+4,pale);line(47+r,y,47-r,y+4,dim)}
for(let r of [6,12,18,24])for(let sign of [-1,1])for(let a=-.65;a<=.65;a+=.018){let x=47+sign*r*Math.cos(a),y=13+r*Math.sin(a);px(x,y,r===24?dim:pale)}
px(47,12,gold);px(47,13,gold);px(46,13,gold);px(48,13,gold);
return '<svg class="towerArt" viewBox="0 0 94 53" shape-rendering="crispEdges" aria-hidden="true">'+[...pts].map(([key,col])=>{let [x,y]=key.split(',');return '<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+col+'"/>'}).join('')+'</svg>'}
const towerMarkup=tower();
function header(a,b){return '<div class="eyebrow">'+a+'</div><h1 class="pagetitle">'+b+'</h1>'}
function indexPage(){return header(L('Merewick local television / CH 09','Místní televize Merewick / K 09'),L('Night service','Noční vysílání'))+'<p class="introText">'+L('Merewick lost its local station in 1979. Tonight it is back on air. Four transmissions still tell the wrong story. Choose a case and recover what really happened.','Merewick přišel v roce 1979 o místní stanici. Dnes znovu vysílá. Čtyři zprávy stále vyprávějí něco jiného, než se stalo. Vyber případ a zjisti pravdu.')+'</p><div class="directory"><div class="leadCta">'+(s.won?btn('go','214',L('See the correction','Přečíst opravu'),'action'):btn('begin','',s.started?L('Continue investigation','Pokračovat v pátrání'):L('Start investigation','Začít pátrat'),'action'))+'</div><figure class="tower">'+towerMarkup+'<figcaption>MWK–09 / 31.10.99</figcaption></figure></div>'+caseLibrary()+'<details class="legacyDirectory"><summary>'+L('Harbour receiver page numbers','Čísla stran pro případ přístavu')+'</summary><div class="routes">'+['214','326','418','500'].map(route).join('')+'</div></details><p class="task">'+L('Each case has its own clues, ending and saved progress. The original tapes stay untouched.','Každý případ má vlastní stopy, závěr i uložený postup. Původní pásky zůstanou beze změny.')+'</p>'}
function bulletin(){const p=pages[s.page],saved=s.found.includes(s.page);return header(L('ACT 01 / HARBOUR BULLETIN','AKT 01 / ZPRÁVA Z PŘÍSTAVU'),title(s.page))+'<p class="lead">'+L(...p.desc)+'</p><div class="views" role="group" aria-label="'+L('Feed comparison','Porovnání vysílání')+'">'+[['live',L('Live','Živě')],['tape',L('Archive','Archiv')],['diff',L('Compare','Porovnat')]].map(([k,v])=>btn('mode',k,v,'tab','aria-pressed="'+(k===mode)+'"')).join('')+'</div><div class="eyebrow rowhead">'+(mode==='live'?L('LIVE REPEAT / 1999','ŽIVÁ REPRÍZA / 1999'):mode==='tape'?L('LOCAL TAPE / 1979','MÍSTNÍ PÁSKA / 1979'):L('LIVE / TAPE • SELECT THE OVERWRITTEN ROW','ŽIVĚ / PÁSKA • VYBER PŘEPSANÝ ŘÁDEK'))+'</div><div class="clueRows">'+p.rows.map((r,i)=>{const a=s.won&&i===p.clue?L('CORRECTION: Ferry returned to East Steps. All five rescued.','OPRAVA: Přívoz se vrátil na Východní schody. Všech pět zachráněno.'):L(...r[0]),b=L(...(r[1]||r[0]));return btn('isolate',i,'<span class="ln">0'+(i+1)+'</span><span class="pair">'+(mode==='diff'?'<small>'+L('LIVE','ŽIVĚ')+'</small> '+a+'<br><span class="savedLine"><small>'+L('TAPE','PÁSKA')+'</small> '+b+'</span>':mode==='tape'?b:a)+'</span>','clueRow',mode==='diff'&&!s.won?'':'disabled')}).join('')+'</div>'+(saved?'<p class="task">'+glyph(p.glyph)+' <b>'+p.time+'</b> · '+L('Fragment logged.','Stopa uložena.')+' '+nextButton()+'</p>':'<p class="task">'+(mode==='diff'?L('Select the row where the meaning changed.','Vyber řádek, ve kterém se změnil smysl.'):L('Compare this broadcast with the saved tape to isolate a buried signal.','Porovnej vysílání s uloženou páskou a odhal skrytý signál.'))+'</p>')}

ressed',String(mode===el.dataset.val))});if(a&&focus&&!document.contains(focus)){const target=Array.from(document.querySelectorAll('[data-do]')).find(el=>el.dataset.do===a&&el.dataset.val===b&&!el.disabled);if(target)target.focus({preventScroll:true})}persist()}

function hints(){if(currentCase())return editionHints();if(s.page==='326'&&!s.found.includes('326'))return [L('Step through the tape. The decisive frame comes after the second steady light but before dropout.','Procházej pásku. Rozhodující záběr je po druhém stálém světle, ale před výpadkem.'),L('Try 6.2s. Ask what the right-hand light did when it appeared.','Zkus 6,2 s. Co udělalo pravé světlo, když se rozsvítilo?')];if(s.page==='418'&&!s.found.includes('418'))return [L('Use Both layers. Match A with A and B with B; compare the chart and light coordinates below the grid.','Použij obě vrstvy. Srovnej A s A a B s B. Pomohou ti souřadnice pod plánem.'),L('At 90°, shift left one square and down one square from the starting phase.','Při 90° posuň vrstvu o jedno pole vlevo a o jedno dolů oproti začátku.')];if(s.page==='793'){if(s.draft&&verificationComplete())return [L('Your verified draft is ready. Broadcast it to update LIVE and preserve ARCHIVE.','Koncept je ověřený. Odvysílej opravu; archiv zůstane nedotčený.')];if(s.draft&&!verificationComplete())return[L('Compare each field in the receiver feed against its parity strip in the archive. Two fields show a different value than their strip predicts.','Porovnej každé pole přijímače s paritním řetězcem v archivu. Najdi dvě pole, jejichž kontrolní kódy nesouhlasí.'),L('The first tampered field names a quay. The second changes a passenger count. Select the quay field first, then the count field.','První přepsané pole uvádí molo. Druhé mění počet osob. Vyber nejprve pole s molem, pak pole s počtem.')];return[L('Read the three fragments in the log. Which correction explains the call and the return run?','Přečti si všechny tři stopy. Která oprava vysvětluje telefonát i zpáteční plavbu?'),L('The boat turned back for the people on the East Steps.','Přívoz se otočil pro lidi na Východních schodech.')]}if(s.found.length===3)return [L('Open P500. Each mark matches one digit. Sort the fragments by time, not page number.','Otevři P50 let soundOn=false,ctx=null;function tone(hz){if(!soundOn)return;try{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume().catch(()=>{});const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+.007);g.gain.exponentialRampToValueAtTime(.0001,t+.095);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.1)}catch{}}

:if(s.page!=='793'||!s.draft||s.won)return;s.slots=[];s.channel=null;tell(L('Slots cleared. Re-read the feeds and select two fields.','Sloty vymazány. Znovu přečti přenosy a vyber dvě pole.'));persist();render();break;case 'redraft':if(!s.won&&s.page==='793'){s.draft=false;s.slots=[];s.channel=null;hintLevel=0;tell();render();$('page').focus({preventScroll:true})}break;case 'begin':begin();break;case 'capture':capture(v);break;case 'freeze':if(s.page==='326'){$('film')?.pause();tell(L('Tape paused. Read the frame or use the timed transcript.','Páska pozastavena. Přečti záběr nebo využij časovaný přepis.'))}break;case 'transcript':changeTranscript();break;case 'mapMove':move(v);break;case 'align':matchMap();break;case 'layer':if(s.page==='418'){s.map.layer=v;render()}break;case 'journal':case 'hint':case 'reset':buf='';updateDigits();modal(a);break;case 'moreHint':hintLevel++;modal('hint');break;case 'manual':closeDlg();go('500');break;case 'close':closeDlg();break;case 'confirmReset':closeDlg();if(currentCase()){caseSaves[s.page]=cleanCase();saveCases();hintLevel=0;go(s.page);break}s=blank(s.lang);hintLevel=0;tapeTime=0;transcriptActive=false;tapePending=null;go('100');break;case 'sound':soundOn=!soundOn;if(s.page==='326'&&$('film')){$('film').muted=!soundOn;$('reset').setAttribute('aria-pressed',String(soundOn));$('reset').textContent=soundOn?L('Sound on','Zvuk zap.'):L('Sound off','Zvuk vyp.')}else render();tone(320);break;case 'lang':if(v!=='cs'&&v!=='en')break;s.lang=v;tell();render();break;default:editionAction(a,v)}}

document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.repeat||e.isComposing||$('modal').open||['INPUT','VIDEO','TEXTAREA'].includes(e.target.tagName))return;if((s.page==='672'||s.page==='747')&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();editionAction(s.page==='672'?'vane':'frame',e.key==='ArrowLeft'?'-1':'1');return}if(s.page==='418'&&['ArrowUp','ArrowDown','ArrowRight','ArrowLeft','r','R'].includes(e.key)){e.preventDefault();move(e.key.toLowerCase()==='r'?'rotate':e.key.slice(5).toLowerCase());return}if(/^\d$/.test(e.key)){e.preventDefault();enterDigit(e.key)}else if(e.key==='Backspace'){e.preventDefault();buf=buf.slice(0,-1);updateDigits()}else if(e.key==='Escape'){buf='';updateDigits();tell()}else if(e.key==='?'||e.key.toLowerCase()==='h'){e.preventDefault();act('hint','')}else if(e.key==='Enter'&&(!e.target.closest('button')||buf.length)){e.preventDefault();act('enter','')}});

const cue={early:5.4,late:7.2,target:6.2,duration:9};
const points=[[3,4,'anchorA'],[4,0,'anchorB'],[2,3,'lamp1'],[1,2,'lamp2'],[1,1,'lamp3']];
const chart=[[1,4,'anchorA'],[5,5,'anchorB'],[2,3,'east'],[3,2,'east'],[4,2,'east'],[2,5,'west'],[3,5,'west'],[4,5,'west'],[1,2,'road'],[2,2,'road'],[3,1,'road']];
const emptyMap=()=>({turn:0,x:0,y:0,layer:'both'});
const alignState=(x={})=>({turn:[0,1,2,3].includes(x?.turn)?x.turn:0,x:Number.isInteger(x?.x)?Math.max(-2,Math.min(2,x.x)):0,y:Number.isInteger(x?.y)?Math.max(-2,Math.min(2,x.y)):0,layer:['both','chart','lights'].includes(x?.layer)?x.layer:'both'});
function transformed({turn,x,y}){return points.map(([c,r,k])=>{for(let i=0;i<turn;i++)[c,r]=[6-r,c];return [c+x,r+y,k]})}
function aligned(m){const pts=transformed(m);return pts.filter(([, ,k])=>k.startsWith('anchor')).every(([x,y,k])=>chart.some(([a,b,l])=>a===x&&b===y&&l===k))&&pts.filter(([, ,k])=>k.startsWith('lamp')).every(([x,y])=>chart.some(([a,b,l])=>a===x&&b===y&&l==='east'))}
function tapeText(t){return t<1?L('Black water. No lamps yet.','Černá voda. Zatím bez světel.'):t<3.3?L('The left lamp comes on.','Rozsvítí se levá lampa.'):t<5.4?L('Two lamps are steady: left and centre.','Dvě lampy svítí trvale: levá a prostřední.'):t<7.2?L('The right-hand lamp joins the sequence and blinks twice. The first two stay on.','Přidá se pravá lampa a dvakrát blikne. První dvě zůstávají rozsvícené.'):L('The tape drops out before any fourth lamp is seen.','Páska vypadne dřív, než se ukáže čtvrtá lampa.')}

const casePages=Object.keys(caseInfo), caseStorage='merewick.teletext.cases.v1';
const cleanCase=()=>({stage:0,published:false,route:[],vane:4,safety:{},frame:0,seen:[],pulse:''});
const initCases=()=>Object.fromEntries(casePages.map(k=>[k,cleanCase()]));
function readCases(){
  const result=initCases();
  try{const x=JSON.parse(localStorage.getItem(caseStorage)||'null');
    for(const k of casePages){const a=x?.[k];if(!a||typeof a!=='object')continue;const d=result[k];
      d.stage=[0,1,2].includes(a.stage)?a.stage:0;d.published=a.published===true&&d.stage===2;
      d.route=Array.isArray(a.route)?[...new Set(a.route.filter(t=>['bridge','cut','depot','shelter'].includes(t)))].slice(0,3):[];
      d.vane=Number.isInteger(a.vane)&&a.vane>=0&&a.vane<8?a.vane:4;
      for(const [cat,allowed] of Object.entries({site:['east','south','west'],until:['0010','0020','0030']}))if(allowed.includes(a.safety?.[cat]))d.safety[cat]=a.safety[cat];
      if(Number.isInteger(a.frame)&&a.frame>=0&&a.frame<=3)d.frame=a.frame;
      d.seen=Array.isArray(a.seen)?[...new Set(a.seen.filter(i=>[0,1,2,3].includes(i)))]:[];
      d.pulse=typeof a.pulse==='string'&&/^[SL]{0,3}$/.test(a.pulse)?a.pulse:'';
    }
  }catch{}
  return result;
}

}
function caseLibrary(){
 return '<section class="caseLibrary"><div class="moduleTitle">'+L('Case library / four transmissions','Archiv případů / čtyři vysílání')+'</div><div class="caseCards">'+btn('begin','','<b>01</b><span>'+L('Harbour Blackout','Výpadek v přístavu')+'<small>'+L('P214 / FERRY INVESTIGATION','P214 / PÁTRÁNÍ PO PŘÍVOZU')+'</small></span><i>'+(s.won?L('✓ CORRECTED','✓ OPRAVENO'):s.started?L('CONTINUE','POKRAČOVAT'):L('OPEN FILE','OTEVŘÍT'))+'</i>','caseCard')+
 casePages.map(p=>{const d=caseInfo[p];return btn('go',p,'<b>'+d.n+'</b><span>'+L(...d.title)+'<small>P'+p+' / '+L(...d.tag)+'</small></span><i>'+stationClass(p)+'</i>','caseCard')}).join('')+'</div></section>';
}
function broadcastStrip(info,save){
 const viewBtns=[['live',L('Live','Živě')],['tape',L('Archive','Archiv')],['diff',L('Compare','Porovnat')]].map(([k,v])=>btn('mode',k,v,'tab','aria-pressed="'+(mode===k)+'"')).join('');
 const live=save.published?L(...info.correction):L(...info.live);
 const tape=L(...info.tape);
 const block=(label,content,extra='')=>'<div class="stationLine '+extra+'"><b>'+label+'</b><span>'+content+'</span></div>';
 return '<div class="views" role="group" aria-label="'+L('Edition signal','Vysílání případu')+'">'+viewBtns+'</div><div class="stationLines">'+(mode==='live'?block('LIVE',live,save.published?'corrected':''):mode==='tape'?block('TAPE',tape,'original'):block('LIVE',live,save.published?'corrected':'')+block('TAPE',tape,'original'))+'</div>';
}
const services=[['r2','R2','23:46','23:58',['West viaduct','Západní viadukt']],['r6','R6','23:39','00:01',['East siding','Východní kolej']],['r8','R8','23:48','00:06',['East siding','Východní kolej']],['r9','R9','23:50','00:13',['East siding','Východní kolej']]];
const railStops={bridge:['West bridge','Západní most'],cut:['East cutting','Východní zářez'],depot:['Lamp depot','Sklad lamp'],shelter:['Shelter','Kryt']};
const railTimes={bridge:'23:49',cut:'23:54',depot:'00:01',shelter:'00:06'};
const dirs=[['N','S'],['NE','SV'],['E','V'],['SE','JV'],['S','J'],['SW','JZ'],['W','Z'],['NW','SZ']];
const flow=['S','L','S','S'];
const flashed={L:'SLSS',R:'SLS',F:'SSLS',K:'LSL'};
const flashIcon=(pulse)=>pulse==='L'?'▬':'▪';
const flashText=(pulse)=>pulse==='L'?L('long','dlouhý'):L('short','krátký');
const seqMarkup=p=>'<span class="pulseSeq" aria-label="'+[...p].map(flashText).join(', ')+'">'+[...p].map(flashIcon).join(' ')+'</span>';
function caseStep(title,desc){return '<div class="moduleTitle">'+title+'</div><p class="lead caseInstructions">'+desc+'</p>'}
function trainPuzzle(q){
 if(q.stage===0)return caseStep(L('01 / Identify the survivor service','01 / Urči záchranný spoj'),L('No boarding before the 23:42 ticket stamp. Exclude the west viaduct. The shelter closes to arrivals at 00:10. Select the only train that fits all three facts.','Před razítkem v 23:42 nikdo nenastoupil. Západní viadukt nepřipadá v úvahu. Kryt se v 00:10 zavírá. Vyber spoj splňující všechny tři podmínky.'))+
 '<div class="trainTable"><div class="trainHeads"><span>ID</span><span>'+L('DEPART','ODJEZD')+'</span><span>'+L('ARRIVE','PŘÍJEZD')+'</span><span>'+L('ROUTE','TRASA')+'</span></div>'+services.map(([k,id,a,b,path])=>btn('trainPick',k,'<b>'+id+'</b><time>'+a+'</time><time>'+b+'</time><span>'+L(...path)+'</span>','trainRow')).join('')+'</div>';
 return caseStep(L('02 / Route through midnight','02 / Trasa přes půlnoc'),L('R8 left at 23:48 and arrived at 00:06. The west bridge ping was from an empty relay, not R8. Select the three real checkpoints in travel order; the clock rolls past midnight.','R8 odjel v 23:48 a dorazil v 00:06. Signál západního mostu patřil prázdnému vysílači, ne vlaku. Vyber tři skutečné body v pořadí jízdy; čas přechází přes půlnoc.'))+
 '<div class="caseChoiceTiles">'+['depot','bridge','shelter','cut'].map(k=>btn('trainRoute',k,'<time>'+railTimes[k]+'</time> '+L(...railStops[k]),'micro','aria-pressed="'+q.route.includes(k)+'"')).join('')+'</div><p class="answerLine" aria-label="'+L('Selected route','Zvolená trasa')+'">'+(q.route.length?q.route.map(k=>L(...railStops[k])).join(' → '):L('No stations selected.','Nejsou vybrané žádné stanice.'))+'</p>'+btn('trainClear','',L('Clear route','Smazat trasu'),'micro')+' '+btn('trainLock','',L('Verify route','Ověřit trasu'),'action');
}
function weatherPuzzle(q){
 if(q.stage===0)return caseStep(L('01 / Correct the receiver','01 / Oprav přijímač'),L('The screen shows the cell moving south. Restore the unrotated reading: the receiver added one quarter-turn clockwise. Use the 45° keys, then lock the corrected direction.','Obrazovka ukazuje postup bouřky na jih. Obnov neotočený údaj: přijímač k němu přidal čtvrt otáčky po směru hodin. Použij kroky po 45° a směr potvrď.'))+
 '<div class="weatherControl"><div class="compass"><span class="compassN">'+L(...dirs[0])+'</span><span class="compassE">'+L(...dirs[2])+'</span><span class="compassS">'+L(...dirs[4])+'</span><span class="compassW">'+L(...dirs[6])+'</span><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="34"/><path transform="rotate('+q.vane*45+' 50 50)" d="M50 15L61 55L51 50L50 80L49 50L39 55Z"/></svg><strong>'+L(...dirs[q.vane])+'</strong></div><div><div class="caseChoiceTiles">'+btn('vane','-1',L('↶ 45° left','↶ 45° vlevo'),'micro')+btn('vane','1',L('↷ 45° right','↷ 45° vpravo'),'micro')+'</div><p class="answerLine">'+L('Reading: ','Směr: ')+L(...dirs[q.vane])+'</p>'+btn('vaneLock','',L('Lock direction','Potvrdit směr'),'action')+'</div></div>';
 return caseStep(L('02 / Build a bridge bulletin','02 / Sestav zprávu pro most'),L('The verified cell heads east. East Bridge expects it from 00:05 to 00:18, with a bus due at 00:10. West Bridge is already closed. Suspend the threatened crossing until the first listed time after the cell clears.','Ověřená bouřka míří na východ. Východní most ji čeká od 00:05 do 00:18 a autobus má projet v 00:10. Západní most je zavřený. Pozastav průjezd na ohroženém mostě do prvního uvedeného času po odeznění bouřky.'))+
 '<div class="weatherChoices"><div class="eyebrow">'+L('BRIDGE','MOST')+'</div><div class="caseChoiceTiles">'+[['east',L('East','Východní')],['south',L('South','Jižní')],['west',L('West','Západní')]].map(([k,v])=>btn('safety','site-'+k,v,'micro','aria-pressed="'+(q.safety.site===k)+'"')).join('')+'</div><div class="eyebrow">'+L('HOLD UNTIL','NEPROJÍŽDĚT DO')+'</div><div class="caseChoiceTiles">'+['0010','0020','0030'].map(k=>btn('safety','until-'+k,'00:'+k.slice(2),'micro','aria-pressed="'+(q.safety.until===k)+'"')).join('')+'</div></div>'+btn('safetyLock','',L('Verify warning','Ověřit varování'),'action');
}
function lightPuzzle(q){
 const alphabet=(entries)=>'<div class="flashTable">'+entries.map(k=>'<span><b>'+k+'</b> '+seqMarkup(flashed[k])+'</span>').join('')+'</div>';
 if(q.stage===0){
  const width=flow[q.frame]==='L'?74:29;
  return caseStep(L('01 / Read the damaged film','01 / Přečti poškozený záznam'),L('Use the previous and next frame keys. Read all four flashes in transmission order. Then choose a letter from the receiver code. The frame label gives an equivalent reading.','Použij tlačítka předchozí a další snímek. Přečti všechny čtyři záblesky v pořadí. Pak vyber písmeno podle kódu přijímače. Typ záblesku uvádí i popisek.'))+
  '<div class="flashReader"><div class="flashFrame"><span>'+L('FRAME ','SNÍMEK ')+(q.frame+1)+'/4</span><div class="flashLight" aria-hidden="true" style="--width:'+width+'%"></div><strong>'+flashText(flow[q.frame])+'</strong></div><div class="caseChoiceTiles">'+btn('frame','-1','‹ '+L('Previous','Předchozí'),'micro')+btn('frame','1',L('Next','Další')+' ›','micro')+'</div></div>'+alphabet(['L','R','F'])+'<div class="caseChoiceTiles">'+['L','R','F'].map(k=>btn('flashDecode',k,k,'micro')).join('')+'</div>';
 }
 return caseStep(L('02 / Send the return code','02 / Odešli odpověď'),L('The watch log says to acknowledge a lower stair call with K. Enter its three pulses using the code key. No timing is required.','Podle deníku potvrď volání ze spodních schodů písmenem K. Sestav jeho tři záblesky podle klíče. Na rychlosti nezáleží.'))+alphabet(['K','R','F'])+
 '<p class="answerLine">'+L('Your reply: ','Tvoje odpověď: ')+(q.pulse?seqMarkup(q.pulse):L('No pulses.','Žádné záblesky.'))+'</p><div class="caseChoiceTiles">'+btn('flashPulse','S',L('▪ Short','▪ Krátký'),'micro')+btn('flashPulse','L',L('▬ Long','▬ Dlouhý'),'micro')+btn('flashClear','',L('Clear','Smazat'),'micro')+'</div>'+btn('flashLock','',L('Verify reply','Ověřit odpověď'),'action');
}
function editionPage(){
 const k=s.page, q=currentCase(), info=caseInfo[k];
 const intro=header('MRT / FILE '+info.n+' / '+info.id,L(...info.title));
 const heading='<p class="lead">'+L(...info.lead)+'</p>';
 const phase='<div class="casePhase"><b>'+L('FILE','PŘÍPAD')+' '+info.n+'</b><span>'+q.stage+'/2 '+L('EVIDENCE','STOPY')+(q.published?' • '+L('ON AIR','VE VYSÍLÁNÍ'):'')+'</span></div>';
 const feed=broadcastStrip(info,q);
 let content='';
 if(q.published)content='<div class="moduleTitle">'+L('Final transmission','Poslední vysílání')+'</div><blockquote class="quote">'+L(...info.quote)+'</blockquote><p class="lead">'+L(...info.ending)+'</p><p class="task">'+L('Compare the LIVE correction with the original TAPE above.','Porovnej živou opravu s původní páskou nahoře.')+'</p>'+btn('go','100',L('Case library','Archiv případů'),'action')+' '+btn('reset','',L('Replay this case','Hrát případ znovu'),'inline');
 else if(q.stage===2)content='<div class="moduleTitle">'+L('Verified draft / not yet on air','Ověřený koncept / zatím mimo vysílání')+'</div><blockquote class="quote">'+L(...info.correction)+'</blockquote><p class="lead">'+L('The original tape will remain untouched. Put this correction back on air when ready.','Původní páska zůstane beze změny. Až budeš připravený, odvysílej opravu.')+'</p>'+btn('editionPublish','',L('Broadcast correction','Odvysílat opravu'),'action');
 else content=k==='611'?trainPuzzle(q):k==='672'?weatherPuzzle(q):lightPuzzle(q);
 return intro+heading+phase+feed+content;
}
function editionAction(action,value){
 const k=s.page,q=currentCase(),info=caseInfo[k];if(!q||q.published)return;
 function retry(en,cs){tone(116);tell(L(en,cs))}
 function refresh(message=''){tell(message);render();saveCases()}
 function advance(){q.stage++;hintLevel=0;refresh(L('Evidence verified.','Stopa ověřena.'));tone(460)}
 if(action==='editionPublish'&&q.stage===2){q.published=true;mode='live';refresh(L('ON AIR. The LIVE bulletin has changed. ARCHIVE is untouched.','VE VYSÍLÁNÍ. Živé vysílání obsahuje opravu. Archiv je beze změny.'));tone(610);$('page').focus({preventScroll:true});return}
 if(k==='611'){
  if(q.stage===0&&action==='trainPick'){
   if(value==='r8')advance();
   else if(value==='r2')retry('R2 uses the blocked west viaduct.','R2 využívá uzavřený západní viadukt.');
   else if(value==='r6')retry('R6 left before the six tickets were stamped.','R6 odjel před orazítkováním šesti jízdenek.');
   else if(value==='r9')retry('R9 arrives after the shelter closes.','R9 přijíždí po uzavření krytu.');
  }else if(q.stage===1){
   if(action==='trainRoute'&&Object.hasOwn(railStops,value)){if(q.route.includes(value))q.route=q.route.filter(k=>k!==value);else if(q.route.length<3)q.route.push(value);else return retry('Remove a stop or clear the current route.','Odeber zastávku nebo smaž nynější trasu.');refresh()}
   if(action==='trainClear'){q.route=[];refresh()}
   if(action==='trainLock'){if(q.route.join()!=='cut,depot,shelter')return retry('Route not confirmed. Ignore the bridge ping and read across midnight.','Trasa nepotvrzena. Ignoruj signál z mostu a seřaď časy přes půlnoc.');advance()}
  }
 } else if(k==='672'){
  if(q.stage===0&&action==='vane'&&['1','-1'].includes(value)){q.vane=(q.vane+8+Number(value))%8;refresh(L('Reading: ','Směr: ')+L(...dirs[q.vane]))}
  if(q.stage===0&&action==='vaneLock'){if(q.vane!==2)return retry('That does not undo the receiver’s clockwise quarter-turn.','Tento směr nevrací čtvrt otáčky přijímače po směru hodin.');advance()}
  if(q.stage===1&&action==='safety'){
   const [t,v]=value.split('-');if(t==='site'&&['east','south','west'].includes(v)||t==='until'&&['0010','0020','0030'].includes(v)){q.safety[t]=v;refresh()}
  }
  if(q.stage===1&&action==='safetyLock'){
   if(q.safety.site!=='east'||q.safety.until!=='0020')return retry('Choose the bridge in the cell’s path and use the first listed reopening time after 00:18.','Vyber most v trase bouřky a první uvedený čas po 00:18.');advance()
  }
 }else if(k==='747'){
  if(q.stage===0&&action==='frame'&&['1','-1'].includes(value)){const next=Math.max(0,Math.min(3,q.frame+Number(value)));q.seen=[...new Set([...q.seen,q.frame,next])];q.frame=next;refresh(L('Frame ','Snímek ')+(q.frame+1)+'/4 · '+flashText(flow[q.frame]))}
  if(q.stage===0&&action==='flashDecode'){
   if(q.seen.length<4)return retry('Review all four surviving frames before decoding.','Před rozluštěním projdi všechny čtyři snímky.');
   if(flashed[value]!==flow.join(''))return retry('The pulse lengths do not match that row of the code table.','Délky záblesků neodpovídají tomuto řádku klíče.');advance()
  }
  if(q.stage===1&&action==='flashPulse'&&['S','L'].includes(value)){
   if(q.pulse.length>=3)return retry('The reply field holds three pulses. Clear it to try a different reply.','Odpověď má tři záblesky. Smaž ji, pokud chceš zadat jinou.');q.pulse+=value;refresh()
  }
  if(q.stage===1&&action==='flashClear'){q.pulse='';refresh()}
  if(q.stage===1&&action==='flashLock'){if(q.pulse!==flashed.K)return retry('No acknowledgement. Compare your three pulses to K.','Bez potvrzení. Porovnej tři záblesky s písmenem K.');advance()}
 }
}
function editionHints(){
 const q=currentCase();if(!q)return [];
 if(q.published)return [L('Your correction is on air. The board still lets you compare it with the tape or pick another file.','Oprava je ve vysílání. Můžeš ji porovnat s páskou nebo otevřít jiný případ.')];
 if(q.stage===2)return [L('Use Broadcast correction to update LIVE without changing the original recording.','Odvysílej opravu. Živé vysílání se změní, původní záznam ne.')];
 if(s.page==='611')return q.stage===0?[L('Check departures, arrival cutoff and whether the train crosses the viaduct.','Porovnej odjezdy, poslední možný příjezd a průjezd viaduktem.'),L('R8 is the only candidate after 23:42 that uses the east siding and arrives before 00:10.','Jen R8 jede po 23:42 východní kolejí a dorazí před 00:10.')]:[L('00:01 comes after 23:54. The bridge ping belongs to a different signal.','00:01 následuje po 23:54. Signál z mostu patří jinému vysílači.'),L('Select East cutting → Lamp depot → Shelter.','Vyber Východní zářez → Sklad lamp → Kryt.')];
 if(s.page==='672')return q.stage===0?[L('Undo a 90° clockwise turn by moving two 45° steps anticlockwise.','Otočení o 90° po směru hodin vrátíš dvěma kroky po 45° proti směru.'),L('Set the vane to East.','Nastav směr na východ.')]:[L('The bus crossing overlaps the cell’s arrival. The hold ends at the first listed time after 00:18.','Autobus přijíždí, když nad mostem bude bouřka. Zákaz končí v prvním uvedeném čase po 00:18.'),L('Select East Bridge and 00:20.','Vyber Východní most a 00:20.')];
 return q.stage===0?[L('Use Next three times to read every frame; short and long are printed beneath each flash.','Třikrát zvol Další a projdi všechny snímky. Pod zábleskem je jeho délka.'),L('Short–long–short–short means L.','Krátký–dlouhý–krátký–krátký znamená L.')]:[L('The archive says to send K, not to repeat the incoming L.','Archiv žádá odpověď K, ne zopakování přijatého L.'),L('K is long–short–long.','K je dlouhý–krátký–dlouhý.')];
}
function editionLog(){
 const q=currentCase(),info=caseInfo[s.page];
 return '<p>'+L(...info.tape)+'</p><div class="moduleTitle">'+L('Verified evidence','Ověřené stopy')+'</div>'+
  (q.stage?info.steps.slice(0,q.stage).map(t=>'<div class="evidence">✓ '+L(...t)+'</div>').join(''):'<p>'+L('Nothing verified yet.','Zatím nic ověřeného.')+'</p>')+
  (q.published?'<p class="task">'+L(...info.correction)+'</p>':'');
}

s=read();tapeTime=s.tapeTime;transcriptActive=s.tapeTranscript;render();
</script></body></html>
